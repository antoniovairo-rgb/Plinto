/*
 * PLINTO per Android: una Trusted Web Activity.
 *
 * NON C'E' CODICE. L'unica Activity la fornisce `androidbrowserhelper`, la libreria
 * ufficiale di Google: apre a tutto schermo il sito gia' pubblicato, usando il motore di
 * Chrome installato sul telefono. Il gioco resta uno solo -- pubblicando una versione nuova
 * su GitHub Pages, l'app si aggiorna da sola. L'`.aab` si ricarica sullo store solo se
 * cambiano icona, nome o permessi.
 *
 * PERCHE' SCRITTO A MANO E NON GENERATO. Lo strumento ufficiale (Bubblewrap) genera questo
 * stesso progetto, ma si porta dietro una PROPRIA catena di strumenti -- JDK 17 e SDK
 * Android da scaricare -- accanto a quella gia' installata. Su questa macchina quel
 * download si e' impiantato due volte. Questo progetto usa invece la catena di Android
 * Studio, che qui ha gia' compilato un'altra app: si apre e si compila, senza scaricare
 * niente.
 */
plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.antoniovairo_rgb.plinto'
    compileSdk 36

    defaultConfig {
        // NON SI PUO' PIU' CAMBIARE dopo la prima pubblicazione sul Play Store: e'
        // l'identita' dell'app per sempre. Cambiarlo significa pubblicare un'app diversa,
        // perdendo installazioni e recensioni.
        applicationId 'io.github.antoniovairo_rgb.plinto'
        // Android 7.0. Non e' una scelta: e' il minimo dichiarato da
        // `androidbrowserhelper` 2.7, e la libreria e' l'unica cosa che questa app
        // contiene. Alzarlo esclude Android 5.x e 6.x.
        minSdk 24
        // Google Play RIFIUTA il caricamento sotto 36 dal 31 agosto 2026. Non e' una
        // raccomandazione: e' un errore bloccante in fase di caricamento.
        targetSdk 36
        // Va alzato a OGNI caricamento sullo store, anche se il gioco non e' cambiato.
        // Play rifiuta un app bundle con un versionCode gia' visto, e "gia' visto"
        // comprende le bozze di release poi cancellate: il numero resta bruciato lo
        // stesso. Non e' la versione del gioco (quella e' `versionName`), e' un
        // contatore di caricamenti.
        versionCode 10307
        // Deve seguire la versione del gioco (`version` in package.json): il
        // contenitore non ha una vita propria, mostra il sito. Un tester che legge
        // "1.3.1" in Informazioni app mentre il gioco dice 1.3.4 segnala un difetto
        // che non esiste.
        versionName '1.9.3'
    }

    buildTypes {
        release {
            // `shrinkResources` non si attiva: non c'e' quasi niente da ridurre, e
            // toglierebbe risorse che la libreria carica per nome a tempo di esecuzione.
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // L'unica dipendenza del progetto. La 2.7 e' la prima versione che sa stare in una
    // app che targetta SDK 36: Android 16 impone il disegno "edge-to-edge" e toglie il
    // modo di rinunciarvi, e la schermata d'avvio la disegna questa libreria, non noi.
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.3'
}
