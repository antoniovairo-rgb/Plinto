# Verifica automatica a ogni push e pull request.
#
# UN SOLO COMANDO, E NON E' PIGRIZIA. Questo flusso elencava a mano sei dei controlli
# del progetto, mentre in locale `npm run verifica` ne esegue undici. Due elenchi che
# dicono cose diverse invecchiano in modo diverso, e il modo in cui invecchiano si e'
# gia' visto: `npm run soak` era l'unico controllo fuori dall'elenco locale, si e'
# rotto (cercava un pulsante che la home non aveva piu') ed e' rimasto rotto per due
# versioni senza che nessuno se ne accorgesse.
#
# Quindi qui si esegue esattamente cio' che esegue chi lavora sul progetto. Aggiungere
# un controllo in `tools/verifica-tutto.mjs` lo fa girare anche in integrazione
# continua, senza doversi ricordare di aggiornare anche questo file.
name: verifica

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # I controlli nel browser sono cinque su undici: senza Chromium non parte nulla.
      - name: Browser per le prove
        run: npx playwright install --with-deps chromium

      # Test unitari, contrasti, build, comunicazioni in due lingue, partita completa,
      # livelli, precisione del trascinamento, build da sottocartella, service worker
      # e installazione, aspetto su schermi grandi, resistenza dopo centinaia di mosse.
      # Non si ferma al primo fallimento: arriva in fondo e stampa il quadro completo.
      - name: Tutti i controlli
        run: npm run verifica

      # Se qualcosa fallisce, il registro completo di OGNI controllo resta scaricabile.
      # Un fallimento intermittente di cui si e' perso il messaggio e' peggio di un
      # fallimento e basta: resta il sospetto e non resta niente su cui lavorare.
      - name: Registro dei controlli
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verifica-log
          path: verifica.log
          if-no-files-found: warn
