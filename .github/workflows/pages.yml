# Pubblicazione del gioco su GitHub Pages.
#
# COME FUNZIONA: la build finisce su un branch dedicato `gh-pages`, che contiene solo
# il risultato di `npm run build`. Il branch non si modifica a mano: si rigenera.
#
# PERCHE' COSI' e non con actions/deploy-pages: quel percorso richiede che un
# amministratore abbia prima attivato Pages con Source "GitHub Actions", e il token
# automatico dei flussi NON puo' farlo da se'. Provato: fallisce con
#   "Resource not accessible by integration ... create-a-pages-site"
# perche' `pages: write` permette di pubblicare su un sito esistente, non di crearlo.
# Spingere un branch, invece, il token lo puo' fare con il solo `contents: write`.
#
# Se Pages non risultasse ancora attivo, l'unico passaggio manuale e':
#   Settings -> Pages -> Build and deployment -> Source: "Deploy from a branch"
#   -> Branch: gh-pages / (root)
# Da quel momento ogni push su main aggiorna il sito da solo.
name: pubblica su Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serve solo poter scrivere un branch: nessun permesso di amministrazione.
permissions:
  contents: write

# Una pubblicazione alla volta, e non si annulla quella in corso per non lasciare
# il sito a meta'.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Non si mette online qualcosa che non ha superato le proprie verifiche.
      - name: Test
        run: npm test

      - name: Build di produzione
        run: npm run build

      # La build e' verificata per funzionare da una sottocartella: e' il caso di
      # GitHub Pages, e senza questo controllo si scoprirebbe con una pagina bianca.
      - name: La build funziona da una sottocartella
        run: |
          npx playwright install --with-deps chromium
          node tools/prova-sottocartella.mjs

      - name: Pubblica su gh-pages
        run: |
          # .nojekyll: senza, Pages passerebbe il sito da Jekyll e ignorerebbe le
          # cartelle che iniziano con un trattino basso.
          touch dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "build da ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
